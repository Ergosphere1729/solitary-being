<html>
		<head>
				<title>Contemplation in the Utopia of Knowledge</title>
		</head>
		<body>
				<h1>A Quiet Pursuit ──── A Utopia full of Timeless Thought</h1>
				<p><div id="fade-box">Hello</div>

<style>
  .fade-in {
    opacity: 0;
    animation: fade 2s forwards;
  }

  @keyframes fade {
    to {
      opacity: 1;
    }
  }
</style>

<script>
  const box = document.getElementById("fade-box");
  box.classList.add("fade-in");
</script>
 <canvas id="myCanvas" width="500" height="200"></canvas>

<script>
  const canvas = document.getElementById("myCanvas");
  const ctx = canvas.getContext("2d");

  let x = 0;

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.beginPath();
    ctx.arc(x, 100, 10, 0, Math.PI * 2);
    ctx.fill();

    x += 1;
    requestAnimationFrame(animate);
  }

  animate();
</script>
